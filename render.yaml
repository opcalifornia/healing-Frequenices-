# Render Blueprint: deploys the API from /backend. MongoDB comes from Atlas
# (set MONGO_URL in the dashboard).
services:
  - type: web
    name: healing-frequencies-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: healing_frequencies
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: TRUST_PROXY
        value: "true"
